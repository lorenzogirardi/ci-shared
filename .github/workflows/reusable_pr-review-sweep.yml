name: Reusable PR Review Sweep

# Scheduled sweep over OPEN pull requests: review the ones whose head SHA
# hasn't been reviewed yet, and (optionally) merge the ones whose review comes
# back clean. All the actual logic lives in scripts/pr_review_sweep.py.
#
# Why a sweep instead of per-PR triggers: a `schedule` run has no PR actor, no
# fork, and no bot-author special-casing, so it always gets the repo's full
# GITHUB_TOKEN. Every failure mode the event-driven review workflows in this
# repo had to work around simply does not exist here -- GitHub capping
# GITHUB_TOKEN to read-only for bot-authored `pull_request` runs, needing
# `pull_request_target` (and its attack surface) to get around that, and
# PRs opened before the workflow existed never firing an event at all.
# Mirrors how openwrt/openwrt actually drives its LLM review: cron plus
# workflow_dispatch, no pull_request trigger.

on:
  workflow_call:
    inputs:
      authors:
        description: 'Comma-separated PR author logins to review (e.g. "renovate[bot]"). Empty = every open PR.'
        required: false
        type: string
        default: ''
      max_prs:
        description: 'Max PRs to review in one sweep (caps model spend per run)'
        required: false
        type: number
        default: 10
      auto_merge:
        description: 'Merge PRs whose review ends in VERDICT: CLEAN. Enable only where merging unattended is acceptable (e.g. dependency-bot PRs with no application code).'
        required: false
        type: boolean
        default: false
      merge_method:
        required: false
        type: string
        default: 'squash'
      merge_poll_seconds:
        description: 'After a fresh push (autofix, or a just-reviewed clean PR), wait up to this long IN THIS JOB for the required checks to settle before deferring the merge to the next sweep. Without this, a commit that would go green ten seconds later always waits for the next scheduled run instead. 0 disables polling.'
        required: false
        type: number
        default: 90
      merge_poll_interval:
        description: 'Seconds between checks_state() polls while waiting on merge_poll_seconds.'
        required: false
        type: number
        default: 15
      required_checks:
        description: 'Comma-separated check-run names that must have SUCCEEDED before a merge (e.g. "checks,workflows"). Strongly recommended with auto_merge: without it the gate only asks that nothing failed, which a single skipped check satisfies — that is how PRs got merged here with nothing tested.'
        required: false
        type: string
        default: ''
      autofix:
        description: 'When CI is failing, push a model-written fix to the PR branch instead of only explaining the failure. It is NEVER merged on the strength of the model: the required checks re-run on the new commit and decide. No file-type restriction beyond .github/workflows/** (that push would be rejected regardless) — a reply may also ask to read one real file (this repo, or an installed package) before proposing an edit, which costs a round like an edit does; raise max_autofix_attempts for code-level migrations, not just manifest edits. The anchor must be unique in its file. Enable only for a dependency bot on a repo whose CI actually exercises the app.'
        required: false
        type: boolean
        default: false
      python_version:
        description: 'Python version for the setup-python step verify_command runs under. Must match the version pr-checks.yml (or equivalent) uses, or a local pass here can mean nothing about the real gate — this is literally how the pydantic/mcp incident happened: it only failed on Python 3.14.'
        required: false
        type: string
        default: '3.12'
      verify_command:
        description: 'Shell command that proves an autofix edit actually works, run in this job BEFORE anything is pushed. Should mirror the real CI gate (dependency resolution, install, a smoke test) as closely as practical. Empty = skip local verification and push on the model''s word alone, as the first version of autofix did.'
        required: false
        type: string
        default: ''
      verify_timeout_seconds:
        required: false
        type: number
        default: 180
      max_autofix_attempts:
        description: 'How many propose-verify rounds to try, IN THIS JOB, before giving up on one PR. Each round that fails verify feeds the real failure back to the model and retries locally — no CI round trip, no extra pushed commits — so this is cheap compared to letting CI itself be the retry loop.'
        required: false
        type: number
        default: 3
      triage_on_failure:
        description: 'When CI is already failing on a PR, explain the failure (quoting the job logs) instead of reviewing the diff. Same single model call either way — and a proven failure is something a model can explain, unlike predicting from a diff whether code will install and run.'
        required: false
        type: boolean
        default: false
      system_prompt_extra:
        description: 'Extra prompt text describing this project / this class of PR'
        required: false
        type: string
        default: ''
      comment_heading:
        required: false
        type: string
        default: 'AI Review (sweep)'
      max_chars:
        required: false
        type: number
        default: 140000
      timeout_seconds:
        required: false
        type: number
        default: 120
      openrouter_model:
        required: false
        type: string
        default: ''
      openrouter_endpoint:
        required: false
        type: string
        default: ''
      openrouter_site_url:
        required: false
        type: string
        default: ''
      openrouter_app_name:
        required: false
        type: string
        default: ''
    secrets:
      openrouter_api_key:
        required: true
      autofix_push_token:
        description: >
          Optional PAT (fine-grained, Contents: Read and write, scoped to
          this repo only) used ONLY for the checkout step's git credential.
          Without it, autofix's `git push` authenticates as GITHUB_TOKEN --
          and GitHub deliberately suppresses the `pull_request` run that
          push would otherwise trigger (its own recursive-workflow guard),
          so CI never actually re-runs on the fix commit and it can never
          merge. A PAT sidesteps that guard because the push is no longer
          attributed to Actions itself. Everything else (gh api calls,
          merging) still uses GITHUB_TOKEN -- this token never needs
          `workflow` scope and can't touch .github/workflows/ merges.
        required: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only used when auto_merge is on
      pull-requests: write   # post/update the review comment
    env:
      OPENROUTER_API_KEY: ${{ secrets.openrouter_api_key }}
      OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
      OPENROUTER_ENDPOINT: ${{ inputs.openrouter_endpoint }}
      OPENROUTER_SITE_URL: ${{ inputs.openrouter_site_url }}
      OPENROUTER_APP_NAME: ${{ inputs.openrouter_app_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN when the secret isn't set -- same
          # behaviour as before this existed, just autofix's push then hits
          # GitHub's recursive-workflow guard again (see secrets.autofix_push_token above).
          token: ${{ secrets.autofix_push_token || github.token }}

      - name: Checkout shared prompts and scripts
        uses: actions/checkout@v4
        with:
          repository: lorenzogirardi/ci-shared
          ref: v1
          path: .shared

      - name: Set up Python for verify_command
        # Matches the interpreter pr-checks.yml verifies against — see the
        # python_version input description for why that match matters.
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Render the system prompt
        env:
          EXTRA: ${{ inputs.system_prompt_extra }}
        run: |
          set -euo pipefail
          mkdir -p .ai
          python3 .shared/scripts/render_prompt.py \
            --template .shared/prompts/pr-review-system.md \
            --rules-file .github/ai-review-rules.md \
            --out .ai/review-system.txt

      - name: Write verify_command to a file
        # A file, not a CLI arg: verify_command is user-authored multiline
        # shell and quoting it safely into an argv string is not worth it.
        env:
          VERIFY_COMMAND: ${{ inputs.verify_command }}
        run: |
          mkdir -p .ai
          printf '%s\n' "$VERIFY_COMMAND" > .ai/verify-command.sh

      - name: Sweep open PRs
        run: |
          set -euo pipefail
          python3 .shared/scripts/pr_review_sweep.py \
            --repo "${{ github.repository }}" \
            --system-file .ai/review-system.txt \
            --ai-script .shared/scripts/openrouter_ai.py \
            --authors "${{ inputs.authors }}" \
            --max-prs ${{ inputs.max_prs }} \
            --max-chars ${{ inputs.max_chars }} \
            --timeout ${{ inputs.timeout_seconds }} \
            --heading "${{ inputs.comment_heading }}" \
            --merge-method "${{ inputs.merge_method }}" \
            --merge-poll-seconds ${{ inputs.merge_poll_seconds }} \
            --merge-poll-interval ${{ inputs.merge_poll_interval }} \
            --required-checks "${{ inputs.required_checks }}" \
            --verify-command-file .ai/verify-command.sh \
            --verify-timeout ${{ inputs.verify_timeout_seconds }} \
            --max-autofix-attempts ${{ inputs.max_autofix_attempts }} \
            ${{ inputs.auto_merge && '--auto-merge' || '' }} \
            ${{ inputs.triage_on_failure && '--triage-on-failure' || '' }} \
            ${{ inputs.autofix && '--autofix' || '' }}
