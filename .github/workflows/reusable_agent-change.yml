name: Reusable Agent Change

# Runs the pipeline on a change that ALREADY exists, whoever wrote it:
#   mode: pr    a pull request. Checks -> reviewer A + B -> bounded fix loop
#               (the agent pushes fix commits to the PR branch) -> final reviewer
#               -> documentation reviewer. One edited comment on the PR.
#   mode: ci    a CI run on a PR just FAILED (called from a workflow_run trigger).
#               The failing checks' own logs are the first input; each failing
#               test gets a verdict (code wrong, test wrong, environment,
#               preexisting) before anything is changed. Tests are the
#               specification: the code is fixed unless the PR's own stated
#               intent explicitly redefines the test. Stops after N consecutive
#               agent commits that still fail CI (max_ci_attempts).
#   mode: push  a push straight to the default branch with no PR. Same review;
#               if blocking findings need a fix it opens a PR from agent/push-<sha>
#               (never pushes to the default branch). Advisory findings are left
#               as a commit comment.
# There is no planner/writer-from-scratch here; the author's own title and
# description are the intent. Nothing is merged.
#
# Does not loop: every commit the pipeline makes has the author
# "ci-shared agents", and a run whose head commit has that author does nothing.
# A push whose commit belongs to a PR is skipped (the PR was reviewed).
#
# Credential boundaries are the same as reusable_agent-pipeline.yml: the step
# that runs the agents has the model key and no write token; the deterministic
# checks run with no secrets in their environment from a checkout that keeps no
# credentials; only the last step holds a write token and runs no repo code.

on:
  workflow_call:
    inputs:
      mode:
        description: '"pr", "push" or "ci"'
        required: true
        type: string
      base_branch:
        required: false
        type: string
        default: 'main'
      required_checks:
        description: 'Checks that must have succeeded before the merge gate merges a certified PR (modes pr and ci).'
        required: false
        type: string
        default: ''
      trusted_logins:
        description: 'Accounts whose certification comments count. Empty = the repository owner and github-actions[bot].'
        required: false
        type: string
        default: ''
      max_ci_attempts:
        description: 'mode ci: consecutive agent commits on a branch that may still fail CI before the agent stops.'
        required: false
        type: number
        default: 3
      python_version:
        required: false
        type: string
        default: '3.12'
      verify_command:
        required: true
        type: string
      verify_timeout_seconds:
        required: false
        type: number
        default: 900
      max_iterations:
        required: false
        type: number
        default: 3
      max_verify_retries:
        required: false
        type: number
        default: 3
      writer_rounds:
        required: false
        type: number
        default: 8
      context_files:
        required: false
        type: string
        default: 'CLAUDE.md,README.md'
      openrouter_model:
        required: false
        type: string
        default: ''
      openrouter_endpoint:
        required: false
        type: string
        default: ''
      openrouter_site_url:
        required: false
        type: string
        default: ''
      openrouter_app_name:
        required: false
        type: string
        default: ''
    secrets:
      openrouter_api_key:
        required: true
      agent_push_token:
        description: 'Fine-grained PAT (Contents + Pull requests: read/write, this repo only, no `workflow` scope). Needed to push fixes so the PR checks re-run.'
        required: true

permissions: {}

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      actions: write      # re-run a CI job that failed in the runner, not in the code (mode ci)
    steps:
      - name: Checkout the change (no credentials kept)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || inputs.mode == 'ci' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: lorenzogirardi/ci-shared
          ref: v2
          path: .shared
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install agent dependencies
        run: pip install -q -r .shared/scripts/requirements-autofix.txt

      - name: Did CI fail in the runner rather than in the code? (re-run it once, do not repair)
        id: infra
        if: inputs.mode == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .shared/scripts/agent_pipeline.py ci-infra \
            --repo "${{ github.repository }}" --run-id ${{ github.event.workflow_run.id }}

      - name: Does this change need a run?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .shared/scripts/agent_pipeline.py guard-change \
            --mode "$MODE" --repo "${{ github.repository }}" --sha "$(git rev-parse HEAD)" \
            --pr "${PR_NUMBER:-0}" --max-streak ${{ inputs.max_ci_attempts }}
          # A failed run for a commit that is no longer the PR head is stale: a
          # newer push (often the agent's own fix) already superseded it. The
          # last write to GITHUB_OUTPUT wins.
          if [ "${{ steps.infra.outputs.infra_retry }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$MODE" = "ci" ] && [ "$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')" != "$FAILED_SHA" ]; then
            echo "stale: the PR head moved on since this CI run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the request (title, description, base) as data files
        id: prepare
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          VERIFY_COMMAND: ${{ inputs.verify_command }}
        run: |
          set -euo pipefail
          mkdir -p .ai
          if [ "$MODE" = "pr" ] || [ "$MODE" = "ci" ]; then
            PR_API="repos/${{ github.repository }}/pulls/$PR_NUMBER"
            gh api "$PR_API" --jq '.title' > .ai/change-title.txt
            gh api "$PR_API" --jq '.body // ""' > .ai/change-body.txt
            BASE="$PR_BASE"
            if [ -z "$BASE" ]; then BASE="$(gh api "$PR_API" --jq '.base.sha')"; fi
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(gh api "$PR_API" --jq '.head.ref')" >> "$GITHUB_OUTPUT"
          else
            git log -1 --format=%s > .ai/change-title.txt
            git log -1 --format=%b > .ai/change-body.txt
            BASE="$PUSH_BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD~1)"; fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$VERIFY_COMMAND" > .ai/verify-command.sh

      - name: Run the agents (model key, no write token)
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.openrouter_api_key }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
          OPENROUTER_ENDPOINT: ${{ inputs.openrouter_endpoint }}
          OPENROUTER_SITE_URL: ${{ inputs.openrouter_site_url }}
          OPENROUTER_APP_NAME: ${{ inputs.openrouter_app_name }}
          # mode ci reads the failing checks' logs through the API. This is the
          # job's GITHUB_TOKEN (contents: read); the verify command never sees it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CI_ARGS=""
          if [ "${{ inputs.mode }}" = "ci" ]; then
            CI_ARGS="--ci-repo ${{ github.repository }} --ci-sha ${{ github.event.workflow_run.head_sha }}"
          fi
          python3 .shared/scripts/agent_pipeline.py change $CI_ARGS \
            --ai-script .shared/scripts/openrouter_ai.py \
            --mode "$([ "${{ inputs.mode }}" = "ci" ] && echo pr || echo "${{ inputs.mode }}")" \
            --base-sha "${{ steps.prepare.outputs.base }}" \
            --title-file .ai/change-title.txt --body-file .ai/change-body.txt \
            --context-files "${{ inputs.context_files }}" \
            --verify-command-file .ai/verify-command.sh \
            --verify-timeout ${{ inputs.verify_timeout_seconds }} \
            --max-iterations ${{ inputs.max_iterations }} \
            --max-verify-retries ${{ inputs.max_verify_retries }} \
            --writer-rounds ${{ inputs.writer_rounds }}

      - name: Publish on the pull request (fixes pushed to its branch, one comment)
        if: steps.guard.outputs.skip != 'true' && inputs.mode != 'push'
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.agent_push_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .shared/scripts/agent_pipeline.py publish-pr \
            --repo "${{ github.repository }}" --pr ${{ steps.prepare.outputs.pr }} \
            --head-ref "${{ steps.prepare.outputs.head_ref }}"

      - name: Merge gate (merges only a certified head commit whose CI is green)
        # A pending CI is not waited for here: the merge workflow runs when it finishes.
        # Both orders work: certification first, then CI -> that run merges; CI first, then
        # certification -> this step merges.
        if: steps.guard.outputs.skip != 'true' && inputs.mode != 'push' && inputs.required_checks != ''
        env:
          GH_TOKEN: ${{ secrets.agent_push_token }}
          TRUSTED: ${{ inputs.trusted_logins || format('{0},github-actions[bot]', github.repository_owner) }}
        run: |
          python3 .shared/scripts/agent_pipeline.py merge-gate \
            --repo "${{ github.repository }}" --pr ${{ steps.prepare.outputs.pr }} \
            --base-branch "${{ inputs.base_branch }}" --required-checks "${{ inputs.required_checks }}" \
            --poll-seconds 0 --trusted "$TRUSTED"

      - name: Publish for a push (fix PR if needed, commit comment for the rest)
        if: steps.guard.outputs.skip != 'true' && inputs.mode == 'push'
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.agent_push_token }}
          GH_TOKEN: ${{ secrets.agent_push_token }}
        run: |
          python3 .shared/scripts/agent_pipeline.py publish \
            --repo "${{ github.repository }}" --base-branch "${{ inputs.base_branch }}" \
            --commit-sha "${{ github.sha }}"

      - name: Upload the run record (prompts, replies, findings, costs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-change-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            .ai/agent-run
            .ai/agents
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
