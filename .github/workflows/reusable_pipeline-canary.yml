name: Reusable Pipeline Canary

# Known changes through the real pipeline, with the outcome checked. For every scenario in the
# repository's canary file a pull request is opened against a throwaway copy of the base branch, the
# ordinary workflows run on it, and the result is compared with what the scenario expects (verdict,
# required checks, which files changed, what they contain). Then everything is closed and deleted.
# Red means the agent loop did something other than what it should. See scripts/pipeline_canary.py.

on:
  workflow_call:
    inputs:
      config:
        description: 'Path of the canary file in the calling repository.'
        required: false
        type: string
        default: '.github/canary.json'
      only:
        description: 'Comma-separated scenario names; empty = all.'
        required: false
        type: string
        default: ''
      candidate:
        description: 'Run the scenarios against the engine about to be released (tag v2-next) instead of v2. The pull requests are then opened against a base branch named canary/next-*, which is what makes the agent workflows pick the candidate.'
        required: false
        type: boolean
        default: false
    secrets:
      agent_push_token:
        description: 'The same token the agents push with: pull requests opened with the job token start no workflow.'
        required: true

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write   # open and close the canary pull requests (the push token only pushes)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: lorenzogirardi/ci-shared
          ref: v2
          path: .shared
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Open the scenarios, wait for the verdicts, check them, clean up
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.agent_push_token }}
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          git config --global --add safe.directory "$PWD"
          echo ".shared/" >> .git/info/exclude
          python3 .shared/scripts/pipeline_canary.py \
            --repo "${{ github.repository }}" --config "${{ inputs.config }}" \
            --tag "${{ inputs.candidate && 'next-' || '' }}${{ github.run_id }}" --only "$ONLY"
